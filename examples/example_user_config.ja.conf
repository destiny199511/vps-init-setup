# VPS 自動セットアップ設定
# 形式は厳密に KEY=VALUE です。引用符やシェルの構文を追加しないでください。
# 権限: chmod 600 config/vps_config.conf (root のみ読み書き可能)

# ユーザー設定
USERNAME=appadmin
# パスワードを設定ファイルに保存しないでください。非対話実行では、一回限りの環境変数 VPS_SETUP_USER_PASSWORD を使用してください。
USER_SHELL=/bin/bash
CREATE_HOME=true
ADD_TO_SUDO=true

# DNS 設定
PRIMARY_DNS=1.1.1.1
SECONDARY_DNS=8.8.8.8

# SSH 設定:
# SSH_KEEP_LEGACY_PORT: true で移行中の保護としてポート22を維持、false で22を閉じてSSH_PORTのみリッスン
# PASSWORD_AUTH: パスワード認証を許可するかどうか (no: 公開鍵のみ, yes: パスワード許可)
# SSH_PUBKEY: 公開鍵文字列 (サーバーには公開鍵のみを保存し、秘密鍵はクライアント側で厳重に保管)
SSH_PORT=2222
SSH_KEEP_LEGACY_PORT=true
PERMIT_ROOT_LOGIN=no
PASSWORD_AUTH=no
SSH_PUBKEY_AUTHENTICATION=yes
SSH_PUBKEY=

# ファイアウォール設定
ALLOWED_PORTS=80,443

# Docker 設定
INSTALL_DOCKER=true
DOCKER_INSTALL_METHOD=official
DOCKER_CGROUP_DRIVER=systemd
DOCKER_LOG_DRIVER=json-file
DOCKER_LOG_OPTS=max-size=10m,max-file=3
DOCKER_LIVE_RESTORE=true

# オプションの Node.js 設定
INSTALL_NPM=false

# 監視設定
ENABLE_MONITORING=true
MONITORING_NETDATA_ENABLED=false
MONITORING_PROMETHEUS_NODE_ENABLED=true

# アカウントセキュリティの基準（システム提供の /etc/security/pwquality.conf が必要です）
ENFORCE_ACCOUNT_SECURITY_BASELINE=true
PASS_MAX_DAYS=365
PASS_MIN_DAYS=1
PASS_WARN_AGE=7
DEFAULT_UMASK=027
PWQUALITY_MINLEN=14
PWQUALITY_MINCLASS=4
PWQUALITY_RETRY=3

# バックアップ設定
ENABLE_BACKUP=true
BACKUP_SCHEDULE=0 2 * * *
BACKUP_DIRECTORIES=/etc /var/www /home
BACKUP_RETENTION=7
BACKUP_COMPRESSION=gzip
BACKUP_DESTINATION=/var/backups/vps
BACKUP_RUN_INITIAL=false

# 破壊的なクリーンアップは既定で無効です。保守時間のレビュー後に、個別の操作とこの確認を同時に有効にしてください。
REMOVE_SNAP=false
CLEAN_PKG_CACHE=false
CLEAN_JOURNAL=false
CLEAN_TEMP=false
IRREVERSIBLE_CLEANUP_CONFIRMED=false

# config/vps_config.conf として保存し、sudo ./vps_setup.sh -n で実行します。
