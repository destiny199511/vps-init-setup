# VPS配置示例文件
# 此文件展示了如何配置VPS一键装机脚本的参数

# 用户配置
USERNAME="appadmin"
HOSTNAME="my-vps-server"
TIMEZONE="Asia/Shanghai"
LOCALE="zh_CN.UTF-8"

# DNS配置
PRIMARY_DNS="1.1.1.1"
SECONDARY_DNS="8.8.8.8"

# SSH配置
SSH_PORT=3422
PERMIT_ROOT_LOGIN="no"
PASSWORD_AUTH="no"

# 防火墙配置
ALLOWED_PORTS="22,80,443,3422"

# Docker配置
INSTALL_DOCKER=true

# 反向代理配置
INSTALL_NPM=true
DOMAIN="example.com"

# 监控配置
INSTALL_NODE_EXPORTER=true

# 备份配置
ENABLE_BACKUP=true
BACKEND_STORAGE="rclone://remote/backup"

# 保存此文件为 config/vps_config.conf 并在运行脚本时使用