# VPS Auto-Setup 示例配置
# 格式严格为 KEY=VALUE；不要添加引号、命令替换或 shell 语法。
# 仅 root 可读写：chmod 600 config/vps_config.conf

# 用户配置
USERNAME=appadmin
# 密码不得写入配置文件。非交互运行时仅使用一次性环境变量 VPS_SETUP_USER_PASSWORD。
HOSTNAME=my-vps-server
TIMEZONE=Asia/Shanghai
LOCALE=zh_CN.UTF-8

# DNS配置
PRIMARY_DNS=1.1.1.1
SECONDARY_DNS=8.8.8.8

# SSH配置：
# SSH_KEEP_LEGACY_PORT: 是否保留旧端口22（true: 保持双端口监听防失联过渡；false: 彻底关闭旧端口仅监听SSH_PORT）
# PASSWORD_AUTH: 是否允许密码远程登录SSH（no: 仅公钥登录；yes: 允许密码登录）
# SSH_PUBKEY: 公钥内容（服务端仅存放公钥于 ~/.ssh/authorized_keys；私钥由客户端本机保存，严禁上传私钥至服务端）
SSH_PORT=3422
SSH_KEEP_LEGACY_PORT=true
PERMIT_ROOT_LOGIN=no
PASSWORD_AUTH=no
SSH_PUBKEY_AUTHENTICATION=yes
SSH_PUBKEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIreplace-with-your-public-key admin@workstation

# 防火墙配置
ALLOWED_PORTS=80,443

# Docker配置
INSTALL_DOCKER=true
DOCKER_CGROUP_DRIVER=systemd
DOCKER_LOG_DRIVER=json-file
DOCKER_LOG_OPTS=max-size=100m,max-file=3
DOCKER_LIVE_RESTORE=true

# 可选 Node.js 配置
INSTALL_NPM=true
DOMAIN=example.com

# 监控配置
ENABLE_MONITORING=true
INSTALL_NODE_EXPORTER=true

# 账户安全基线（要求系统提供 /etc/security/pwquality.conf）
ENFORCE_ACCOUNT_SECURITY_BASELINE=true
PASS_MAX_DAYS=365
PASS_MIN_DAYS=1
PASS_WARN_AGE=7
DEFAULT_UMASK=027
PWQUALITY_MINLEN=14
PWQUALITY_MINCLASS=4
PWQUALITY_RETRY=3

# 备份配置
ENABLE_BACKUP=true
BACKUP_SCHEDULE=0 2 * * *
BACKUP_DIRECTORIES=/etc /home
BACKUP_RETENTION=30
BACKUP_COMPRESSION=gzip
BACKUP_ENCRYPTION=false
BACKUP_DESTINATION=/var/backups/vps-init-setup

# 破坏性清理默认关闭。只有经过维护窗口审核后，才同时将相关开关和确认键设为 true。
REMOVE_SNAP=false
CLEAN_PKG_CACHE=false
CLEAN_JOURNAL=false
CLEAN_TEMP=false
IRREVERSIBLE_CLEANUP_CONFIRMED=false

# 保存为 config/vps_config.conf 后，以 sudo ./vps_setup.sh -n 执行。