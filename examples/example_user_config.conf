# VPS Auto-Setup 示例配置
# 格式严格为 KEY=VALUE；不要添加引号、命令替换或 shell 语法。
# 仅 root 可读写：chmod 600 config/vps_config.conf

# 用户配置
USERNAME=appadmin
HOSTNAME=my-vps-server
TIMEZONE=Asia/Shanghai
LOCALE=zh_CN.UTF-8

# DNS配置
PRIMARY_DNS=1.1.1.1
SECONDARY_DNS=8.8.8.8

# SSH配置：禁用密码认证时，SSH_PUBKEY 必须是已验证的单行公钥。
SSH_PORT=3422
SSH_KEEP_LEGACY_PORT=true
PERMIT_ROOT_LOGIN=no
PASSWORD_AUTH=no
SSH_PUBKEY_AUTHENTICATION=yes
SSH_PUBKEY=ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIreplace-with-your-public-key admin@workstation

# 防火墙配置
ALLOWED_PORTS=80,443

# Docker配置
INSTALL_DOCKER=true
DOCKER_CGROUP_DRIVER=systemd
DOCKER_LOG_DRIVER=json-file
DOCKER_LOG_OPTS=max-size=100m,max-file=3
DOCKER_LIVE_RESTORE=true

# 可选 Node.js 配置
INSTALL_NPM=true
DOMAIN=example.com

# 监控配置
ENABLE_MONITORING=true
INSTALL_NODE_EXPORTER=true

# 备份配置
ENABLE_BACKUP=true
BACKUP_SCHEDULE=0 2 * * *
BACKUP_DIRECTORIES=/etc /home
BACKUP_RETENTION=30
BACKUP_COMPRESSION=gzip
BACKUP_ENCRYPTION=false
BACKUP_DESTINATION=/var/backups/vps-init-setup

# 保存为 config/vps_config.conf 后，以 sudo ./vps_setup.sh -n 执行。