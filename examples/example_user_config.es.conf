# Configuración de Auto-Setup de VPS
# El formato es estrictamente CLAVE=VALOR. No añada comillas ni sintaxis de shell.
# Permisos: chmod 600 config/vps_config.conf (legible solo por root)

# Configuración de usuario
USERNAME=appadmin
USER_SHELL=/bin/bash
CREATE_HOME=true
ADD_TO_SUDO=true

# Configuración DNS
PRIMARY_DNS=1.1.1.1
SECONDARY_DNS=8.8.8.8

# Configuración SSH: Si se desactiva autenticación por contraseña, SSH_PUBKEY debe ser una clave válida de una sola línea.
SSH_PORT=2222
SSH_KEEP_LEGACY_PORT=true
PERMIT_ROOT_LOGIN=no
PASSWORD_AUTH=no
SSH_PUBKEY_AUTHENTICATION=yes
SSH_PUBKEY=

# Configuración de firewall
ALLOWED_PORTS=80,443

# Configuración de Docker
INSTALL_DOCKER=true
DOCKER_INSTALL_METHOD=official
DOCKER_CGROUP_DRIVER=systemd
DOCKER_LOG_DRIVER=json-file
DOCKER_LOG_OPTS=max-size=10m,max-file=3
DOCKER_LIVE_RESTORE=true

# Configuración opcional de Node.js
INSTALL_NPM=false

# Configuración de monitorización
ENABLE_MONITORING=true
MONITORING_NETDATA_ENABLED=false
MONITORING_PROMETHEUS_NODE_ENABLED=true

# Configuración de copias de seguridad
ENABLE_BACKUP=true
BACKUP_SCHEDULE=0 2 * * *
BACKUP_DIRECTORIES=/etc /var/www /home
BACKUP_RETENTION=7
BACKUP_COMPRESSION=gzip
BACKUP_DESTINATION=/var/backups/vps
BACKUP_RUN_INITIAL=false

# Guarde como config/vps_config.conf y ejecute con: sudo ./vps_setup.sh -n
