# Configuración de Auto-Setup de VPS
# El formato es estrictamente CLAVE=VALOR. No añada comillas ni sintaxis de shell.
# Permisos: chmod 600 config/vps_config.conf (legible solo por root)

# Configuración de usuario
USERNAME=appadmin
# Nunca guarde contrasenas en archivos de configuracion. Para ejecuciones no interactivas, use la variable de entorno de un solo uso VPS_SETUP_USER_PASSWORD.
USER_SHELL=/bin/bash
CREATE_HOME=true
ADD_TO_SUDO=true

# Configuración DNS
PRIMARY_DNS=1.1.1.1
SECONDARY_DNS=8.8.8.8

# Configuración SSH:
# SSH_KEEP_LEGACY_PORT: true para mantener puerto 22 abierto durante la migración; false para cerrarlo
# PASSWORD_AUTH: si se permite autenticación por contraseña (no: solo claves; yes: permitir contraseñas)
# SSH_PUBKEY: contenido de la clave pública (la clave privada se conserva en el cliente local)
SSH_PORT=2222
SSH_KEEP_LEGACY_PORT=true
PERMIT_ROOT_LOGIN=no
PASSWORD_AUTH=no
SSH_PUBKEY_AUTHENTICATION=yes
SSH_PUBKEY=

# Configuración de firewall
ALLOWED_PORTS=80,443

# Configuración de Docker
INSTALL_DOCKER=true
DOCKER_INSTALL_METHOD=official
DOCKER_CGROUP_DRIVER=systemd
DOCKER_LOG_DRIVER=json-file
DOCKER_LOG_OPTS=max-size=10m,max-file=3
DOCKER_LIVE_RESTORE=true

# Configuración opcional de Node.js
INSTALL_NPM=false

# Configuración de monitorización
ENABLE_MONITORING=true
MONITORING_NETDATA_ENABLED=false
MONITORING_PROMETHEUS_NODE_ENABLED=true

# Base de seguridad de cuentas (requiere /etc/security/pwquality.conf proporcionado por el sistema)
ENFORCE_ACCOUNT_SECURITY_BASELINE=true
PASS_MAX_DAYS=365
PASS_MIN_DAYS=1
PASS_WARN_AGE=7
DEFAULT_UMASK=027
PWQUALITY_MINLEN=14
PWQUALITY_MINCLASS=4
PWQUALITY_RETRY=3

# Configuración de copias de seguridad
ENABLE_BACKUP=true
BACKUP_SCHEDULE=0 2 * * *
BACKUP_DIRECTORIES=/etc /var/www /home
BACKUP_RETENTION=7
BACKUP_COMPRESSION=gzip
BACKUP_DESTINATION=/var/backups/vps
BACKUP_RUN_INITIAL=false

# La limpieza destructiva esta deshabilitada por defecto. Active una accion individual y esta confirmacion solo despues de revisar la ventana de mantenimiento.
REMOVE_SNAP=false
CLEAN_PKG_CACHE=false
CLEAN_JOURNAL=false
CLEAN_TEMP=false
IRREVERSIBLE_CLEANUP_CONFIRMED=false

# Guarde como config/vps_config.conf y ejecute con: sudo ./vps_setup.sh -n
