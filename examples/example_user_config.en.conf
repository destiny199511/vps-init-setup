# VPS Auto-Setup Configuration
# Format is strictly KEY=VALUE. Do not add quotes, shell expansions, or command substitutions.
# Permissions: chmod 600 config/vps_config.conf (readable only by root)

# User configuration
USERNAME=appadmin
# USER_PASSWORD: user password for system/sudo (optional, leave empty to preserve existing or use pubkey only)
# USER_PASSWORD=MySecurePassword123!
USER_SHELL=/bin/bash
CREATE_HOME=true
ADD_TO_SUDO=true

# DNS configuration
PRIMARY_DNS=1.1.1.1
SECONDARY_DNS=8.8.8.8

# SSH configuration:
# SSH_KEEP_LEGACY_PORT: true to keep legacy port 22 open for migration safety; false to close port 22 and listen only on SSH_PORT
# PASSWORD_AUTH: whether to allow password authentication (no: keys only; yes: allow passwords)
# SSH_PUBKEY: public key string (server stores only public key in ~/.ssh/authorized_keys; private key stays on client)
SSH_PORT=2222
SSH_KEEP_LEGACY_PORT=true
PERMIT_ROOT_LOGIN=no
PASSWORD_AUTH=no
SSH_PUBKEY_AUTHENTICATION=yes
SSH_PUBKEY=

# Firewall configuration
ALLOWED_PORTS=80,443

# Docker configuration
INSTALL_DOCKER=true
DOCKER_INSTALL_METHOD=official
DOCKER_CGROUP_DRIVER=systemd
DOCKER_LOG_DRIVER=json-file
DOCKER_LOG_OPTS=max-size=10m,max-file=3
DOCKER_LIVE_RESTORE=true

# Optional Node.js configuration
INSTALL_NPM=false

# Monitoring configuration
ENABLE_MONITORING=true
MONITORING_NETDATA_ENABLED=false
MONITORING_PROMETHEUS_NODE_ENABLED=true

# Backup configuration
ENABLE_BACKUP=true
BACKUP_SCHEDULE=0 2 * * *
BACKUP_DIRECTORIES=/etc /var/www /home
BACKUP_RETENTION=7
BACKUP_COMPRESSION=gzip
BACKUP_DESTINATION=/var/backups/vps
BACKUP_RUN_INITIAL=false

# Save as config/vps_config.conf, then run with: sudo ./vps_setup.sh -n
