name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          mkdir -p dist
          archive="dist/vps-init-setup-${GITHUB_REF_NAME}.tar.gz"
          tar -czf "$archive" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='dist' \
            --exclude='config' \
            --exclude='logs' \
            --exclude='backups' \
            .
          sha256sum "$archive" > "${archive}.sha256"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/vps-init-setup-${{ github.ref_name }}.tar.gz
            dist/vps-init-setup-${{ github.ref_name }}.tar.gz.sha256
