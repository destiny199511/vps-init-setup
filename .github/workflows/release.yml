name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create archive
        run: |
          mkdir -p dist
          tar -czf dist/vps-auto-setup-${GITHUB_REF_NAME}.tar.gz \
            --exclude='.git' \
            --exclude='.github' \
            .

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/vps-auto-setup-${{ github.ref_name }}.tar.gz
