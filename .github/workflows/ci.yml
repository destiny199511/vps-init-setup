name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Validate Bash syntax
        run: find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n

      - name: Run ShellCheck
        run: shellcheck --shell=bash --severity=error install.sh vps_setup.sh lib/*.sh modules/*.sh tests/*.sh

      - name: Run regression checks
        run: bash tests/regression.sh